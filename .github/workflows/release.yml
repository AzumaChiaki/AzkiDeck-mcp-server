name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      # 打自包含运行包:dist + 生产依赖 + package.json,服务器解压即用、无需 npm
      - name: bundle
        run: |
          mkdir -p bundle/azkideck-mcp-server
          cp -r dist package.json package-lock.json bundle/azkideck-mcp-server/
          cp -r README.md LICENSE docs bundle/azkideck-mcp-server/
          cd bundle/azkideck-mcp-server
          npm ci --omit=dev
          cd ../..
          tar -czf azkideck-mcp-server-bundle.tar.gz -C bundle azkideck-mcp-server
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: azkideck-mcp-server-bundle.tar.gz
